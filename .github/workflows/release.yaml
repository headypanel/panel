name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build release and installer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $VERSION"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Type-check frontend
        run: yarn tsc

      - name: Build production frontend
        run: yarn build:production

      - name: Set release version in packaged source
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          php -r '
            $path = "config/app.php";
            $version = substr(getenv("VERSION"), 1);
            $content = file_get_contents($path);
            $marker = "\x27version\x27 => \x27canary\x27";
            if ($content === false || !str_contains($content, $marker)) {
                fwrite(STDERR, "Expected canary version marker not found in config/app.php\n");
                exit(1);
            }
            $content = str_replace($marker, "\x27version\x27 => \x27" . $version . "\x27", $content);
            if (file_put_contents($path, $content) === false) {
                fwrite(STDERR, "Unable to update config/app.php\n");
                exit(1);
            }
          '

      - name: Create panel archive
        run: |
          rm -rf node_modules tests CONTRIBUTING.md flake.lock flake.nix phpunit.xml shell.nix
          tar -czf panel.tar.gz * .editorconfig .env.example .eslintignore .eslintrc.js .gitignore .prettierrc.json

      - name: Generate release-specific installer
        env:
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          sed \
            -e "s|__VERSION__|$VERSION|g" \
            -e "s|__REPOSITORY__|$REPOSITORY|g" \
            scripts/install-panel.sh > headypanel-install.sh
          chmod 755 headypanel-install.sh
          bash -n headypanel-install.sh
          grep -Fq "RELEASE_VERSION=\"$VERSION\"" headypanel-install.sh
          grep -Fq "REPOSITORY=\"$REPOSITORY\"" headypanel-install.sh

      - name: Extract release changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          awk -v heading="## $VERSION" '
            $0 == heading { found=1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_CHANGELOG
          if [[ ! -s RELEASE_CHANGELOG ]]; then
            printf 'HeadyPanel %s release. See the source tag for details.\n' "$VERSION" > RELEASE_CHANGELOG
          fi

      - name: Publish draft release assets
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body_path: RELEASE_CHANGELOG
          files: |
            panel.tar.gz
            headypanel-install.sh
