name: Refresh vulnerable Composer dependencies

on:
  workflow_dispatch:
  push:
    branches: [1.0-develop]
    paths:
      - composer.json
      - .github/workflows/refresh-composer-security.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0-develop
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Update vulnerable dependencies
        run: |
          composer update laravel/framework league/commonmark league/flysystem phpseclib/phpseclib symfony/http-foundation symfony/yaml --with-all-dependencies --no-interaction
      - name: Validate lockfile and audit dependencies
        run: |
          composer validate --no-check-publish
          composer audit --locked --no-dev
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- composer.lock; then
            echo "No lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "fix: update vulnerable Composer dependencies [skip ci]"
          git push origin HEAD:1.0-develop
