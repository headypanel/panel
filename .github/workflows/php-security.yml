name: PHP security checks

on:
  push:
    branches: ["1.0-develop", "feature/release-installer", "security/**"]
  pull_request:
    branches: ["1.0-develop"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    name: Composer dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up supported PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, curl, gd, intl, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Audit locked dependencies
        run: composer audit --locked --no-dev

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Check runtime platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Verify installer shell syntax
        run: bash -n scripts/install-panel.sh

  docker-build:
    name: Build panel Docker image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --pull --tag headypanel-panel:ci .
