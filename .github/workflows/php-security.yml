name: PHP security checks

on:
  push:
    branches: [ "1.0-develop", "security/**" ]
  pull_request:
    branches: [ "1.0-develop" ]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    name: Composer dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Audit locked dependencies
        run: composer audit --locked --no-dev
      - name: Check runtime platform requirements
        run: composer check-platform-reqs --no-dev

  docker-build:
    name: Build hardened PHP image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --pull --tag headypanel-panel:security .
